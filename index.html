<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title id="pageTitle">João &amp; Layla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1c0f22;
    --wine:#5c2a4d;
    --rose:#f4b8c7;
    --gold:#d9a95c;
    --cream:#faf1e4;
    --ink:#2a1420;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(244,184,199,0.15), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(217,169,92,0.12), transparent),
      linear-gradient(180deg, var(--night) 0%, var(--ink) 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .frame{width:100%; max-width:430px; min-height:100vh; position:relative;}

  #entry{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--night), var(--ink));
    text-align:center; padding:32px; transition:opacity 0.9s ease, visibility 0.9s;
  }
  #entry.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .heart-mark{font-size:38px; margin-bottom:18px; animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
  #entry h1{font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:26px; margin:0 0 8px;}
  #entry p{opacity:0.65; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; margin:0 0 32px;}
  #openBtn{
    background:linear-gradient(120deg, var(--gold), var(--rose));
    color:var(--ink); border:none; padding:14px 32px; border-radius:999px;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    letter-spacing:0.03em; cursor:pointer; box-shadow:0 10px 30px rgba(217,169,92,0.25);
  }
  #openBtn:focus-visible{outline:2px solid var(--cream); outline-offset:3px;}

  main{padding:36px 22px 60px; opacity:0; transition:opacity 0.6s ease;}
  main.show{opacity:1;}
  section{margin-bottom:44px;}
  .eyebrow{font-size:11px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.55; text-align:center; margin:0 0 10px;}

  .hero{text-align:center;}
  .hero h1{font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:40px; line-height:1.05; margin:0 0 6px;}
  .hero h1 .amp{color:var(--rose); font-style:normal; padding:0 6px;}
  .hero .since{font-size:12px; opacity:0.55; margin:0;}

  .countdown{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:26px;}
  .countdown .cell{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:14px 6px; text-align:center;
  }
  .countdown .num{font-family:'Fraunces', serif; font-weight:600; font-size:26px; display:block; color:var(--rose);}
  .countdown .lbl{font-size:10px; opacity:0.55; text-transform:uppercase; letter-spacing:0.08em;}

  .story-row{display:flex; gap:16px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none;}
  .story-row::-webkit-scrollbar{display:none;}
  .story{flex-shrink:0; width:74px; text-align:center; cursor:pointer; background:none; border:none; color:inherit; font-family:inherit;}
  .story .ring{
    width:66px; height:66px; border-radius:50%;
    padding:3px; background:conic-gradient(from 220deg, var(--gold), var(--rose), var(--gold));
    margin:0 auto 8px;
  }
  .story .ring-inner{width:100%; height:100%; border-radius:50%; padding:2px; background:var(--night);}
  .story img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
  .story .placeholder{width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--wine), var(--night)); font-size:18px;}
  .story .cap{font-size:10.5px; opacity:0.7; line-height:1.2;}

  #viewer{position:fixed; inset:0; background:#000; z-index:60; display:none; flex-direction:column;}
  #viewer.open{display:flex;}
  .viewer-bars{display:flex; gap:4px; padding:10px 10px 0;}
  .viewer-bars .bar{flex:1; height:2.5px; background:rgba(255,255,255,0.25); border-radius:2px; overflow:hidden;}
  .viewer-bars .bar .fill{height:100%; width:0%; background:#fff;}
  .viewer-top{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; color:#fff;}
  .viewer-top .who{display:flex; align-items:center; gap:8px; font-size:13px; opacity:0.9;}
  .viewer-top .who .dot{width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--rose));}
  .viewer-top button{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px;}
  .viewer-body{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .viewer-body img{width:100%; height:100%; object-fit:cover;}
  .viewer-body .caption{position:absolute; bottom:26px; left:0; right:0; text-align:center; color:#fff; font-family:'Fraunces', serif; font-style:italic; font-size:16px; text-shadow:0 2px 12px rgba(0,0,0,0.6); padding:0 20px;}
  .viewer-nav{position:absolute; inset:0; display:flex;}
  .viewer-nav div{flex:1;}

  .player-card{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:22px; overflow:hidden;}
  .player-art{position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:linear-gradient(135deg, var(--wine), var(--night));}
  .player-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1s ease;}
  .player-art img.active{opacity:1;}
  .player-art .veil{position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.55)); pointer-events:none;}
  .player-info{padding:16px 18px 6px;}
  .player-info .title{font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:0 0 2px;}
  .player-info .artist{font-size:12px; opacity:0.6; margin:0;}
  .progress-wrap{padding:14px 18px 0;}
  .progress-bar{height:3px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; cursor:pointer;}
  .progress-fill{height:100%; width:0%; background:var(--rose);}
  .time-row{display:flex; justify-content:space-between; font-size:10px; opacity:0.5; margin-top:5px;}
  .controls{display:flex; align-items:center; justify-content:center; gap:26px; padding:14px 18px 20px;}
  .controls button{background:none; border:none; color:var(--cream); cursor:pointer; padding:6px;}
  .controls .play{width:48px; height:48px; border-radius:50%; background:var(--cream); color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .controls svg{width:20px; height:20px;}
  .controls .play svg{width:20px; height:20px;}

  footer{text-align:center; padding:10px 10px 0;}
  footer p{font-family:'Fraunces', serif; font-style:italic; font-size:15px; opacity:0.75; line-height:1.6; margin:0;}
  footer .sign{display:block; margin-top:10px; font-size:11px; opacity:0.5; font-style:normal; letter-spacing:0.08em; text-transform:uppercase;}
  .admin-link{position:fixed; bottom:8px; right:10px; font-size:10px; opacity:0.15; color:var(--cream); text-decoration:none; z-index:5;}

  @media (prefers-reduced-motion: reduce){
    .heart-mark{animation:none;}
    main, #entry{transition:none;}
  }
</style>
</head>
<body>

<div id="entry">
  <div class="heart-mark">♥</div>
  <h1 id="entryTitle">Um presente</h1>
  <p>Toque para abrir</p>
  <button id="openBtn">Abrir ♥</button>
</div>

<div class="frame">
  <main id="main">

    <section class="hero">
      <div class="eyebrow" id="eyebrowDate">desde</div>
      <h1 id="heroTitle"></h1>
      <p class="since" id="sinceLabel"></p>

      <div class="countdown">
        <div class="cell"><span class="num" id="years">0</span><span class="lbl">anos</span></div>
        <div class="cell"><span class="num" id="months">0</span><span class="lbl">meses</span></div>
        <div class="cell"><span class="num" id="days">0</span><span class="lbl">dias</span></div>
        <div class="cell"><span class="num" id="hours">0</span><span class="lbl">horas</span></div>
        <div class="cell"><span class="num" id="minutes">0</span><span class="lbl">min</span></div>
        <div class="cell"><span class="num" id="seconds">0</span><span class="lbl">seg</span></div>
      </div>
    </section>

    <section>
      <div class="eyebrow">nossos momentos</div>
      <div class="story-row" id="storyRow"></div>
    </section>

    <section>
      <div class="eyebrow">nossa trilha sonora</div>
      <div class="player-card">
        <div class="player-art" id="playerArt">
          <div class="veil"></div>
        </div>
        <div class="player-info">
          <p class="title" id="songTitle">—</p>
          <p class="artist" id="songArtist">—</p>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
        </div>
        <div class="controls">
          <button id="prevBtn" aria-label="Anterior">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="play" id="playBtn" aria-label="Reproduzir">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="nextBtn" aria-label="Próxima">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <footer>
      <p id="footerMessage"></p>
      <span class="sign" id="footerSign"></span>
    </footer>

  </main>
</div>

<a class="admin-link" href="admin.html">admin</a>

<div id="viewer">
  <div class="viewer-bars" id="viewerBars"></div>
  <div class="viewer-top">
    <div class="who"><div class="dot"></div><span id="viewerName">Nós dois</span></div>
    <button id="viewerClose" aria-label="Fechar">✕</button>
  </div>
  <div class="viewer-body">
    <img id="viewerImg">
    <div class="caption" id="viewerCaption"></div>
    <div class="viewer-nav"><div id="navPrev"></div><div id="navNext"></div></div>
  </div>
</div>

<script>
/* ======================================================
   Este site lê as informações (título, data, fotos, música)
   de um arquivo config.json hospedado no Cloudinary.
   Edite tudo isso pelo painel admin.html — não precisa
   mexer neste arquivo.
====================================================== */
const CLOUD_NAME = "dcvqnr1c";
const CLOUD_FOLDER = "joao-e-layla";
const CONFIG_URL = `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${CLOUD_FOLDER}/config.json`;

const DEFAULT_CONFIG = {
  partner1: "João",
  partner2: "Layla",
  sinceDate: "2024-03-28T22:00",
  sinceLabel: "contando cada segundo desde as 22:00",
  footerMessage: "Cada segundo desde que começamos vale a pena contar.",
  footerSign: "com amor, João",
  songTitle: "Nome da música",
  songArtist: "João & Layla",
  audioUrl: "",
  stories: [
    { name: "1º encontro", caption: "Onde tudo começou", imageUrl: "" },
    { name: "Primeira viagem", caption: "Nossa primeira viagem juntos", imageUrl: "" },
    { name: "Dia especial", caption: "Um dia que não esqueço", imageUrl: "" },
    { name: "Risadas", caption: "Sempre rindo com você", imageUrl: "" },
    { name: "Aniversário", caption: "Comemorando mais um ano", imageUrl: "" },
    { name: "Hoje", caption: "E hoje, ainda apaixonado", imageUrl: "" }
  ],
  playerPhotoUrls: []
};

let CONFIG = DEFAULT_CONFIG;
let startDate = new Date(DEFAULT_CONFIG.sinceDate + ":00-03:00");

async function loadConfig(){
  try{
    const res = await fetch(CONFIG_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok){
      const remote = await res.json();
      CONFIG = Object.assign({}, DEFAULT_CONFIG, remote);
    }
  }catch(e){ /* usa DEFAULT_CONFIG se ainda não existir config.json */ }
  render();
}

function placeholderFallback(el, iconSize){
  el.addEventListener('error', () => {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.innerHTML = '♥';
    ph.style.fontSize = (iconSize || 18) + 'px';
    ph.style.color = 'rgba(250,241,228,0.5)';
    el.replaceWith(ph);
  }, { once:true });
}

function render(){
  document.title = `${CONFIG.partner1} & ${CONFIG.partner2}`;
  document.getElementById('entryTitle').textContent = `Um presente para ${CONFIG.partner2}`;
  document.getElementById('heroTitle').innerHTML = `${CONFIG.partner1}<span class="amp">&amp;</span>${CONFIG.partner2}`;
  document.getElementById('sinceLabel').textContent = CONFIG.sinceLabel;
  document.getElementById('footerMessage').textContent = `"${CONFIG.footerMessage}"`;
  document.getElementById('footerSign').textContent = CONFIG.footerSign;
  document.getElementById('songTitle').textContent = CONFIG.songTitle;
  document.getElementById('songArtist').textContent = CONFIG.songArtist;

  startDate = new Date(CONFIG.sinceDate + ":00-03:00");
  updateTimer();

  const storyRow = document.getElementById('storyRow');
  storyRow.innerHTML = "";
  CONFIG.stories.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'story';
    btn.innerHTML = `
      <div class="ring"><div class="ring-inner">
        <img src="${s.imageUrl}" alt="${s.name}">
      </div></div>
      <div class="cap">${s.name}</div>`;
    const img = btn.querySelector('img');
    placeholderFallback(img, 20);
    btn.addEventListener('click', () => openViewer(i));
    storyRow.appendChild(btn);
  });

  const viewerBars = document.getElementById('viewerBars');
  viewerBars.innerHTML = "";
  CONFIG.stories.forEach(() => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.innerHTML = '<div class="fill"></div>';
    viewerBars.appendChild(bar);
  });

  const playerArt = document.getElementById('playerArt');
  playerArt.querySelectorAll('img').forEach(el => el.remove());
  const photos = CONFIG.playerPhotoUrls && CONFIG.playerPhotoUrls.length
    ? CONFIG.playerPhotoUrls
    : CONFIG.stories.map(s => s.imageUrl).filter(Boolean).slice(0,3);
  photos.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    if (i === 0) img.classList.add('active');
    placeholderFallback(img, 0);
    playerArt.insertBefore(img, playerArt.querySelector('.veil'));
  });
  artImgs = playerArt.querySelectorAll('img');
  artIndex = 0;

  if (CONFIG.audioUrl){
    audio.src = CONFIG.audioUrl;
  }
}

/* ====================== Countdown ====================== */
function updateTimer(){
  const now = new Date();
  let diff = Math.floor((now - startDate) / 1000);
  if (diff < 0) diff = 0;
  const s = diff % 60; diff = Math.floor(diff / 60);
  const m = diff % 60; diff = Math.floor(diff / 60);
  const h = diff % 24; diff = Math.floor(diff / 24);
  let y = now.getFullYear() - startDate.getFullYear();
  let mo = now.getMonth() - startDate.getMonth();
  let d = now.getDate() - startDate.getDate();
  if (d < 0){ mo--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (mo < 0){ y--; mo += 12; }
  document.getElementById('years').textContent = Math.max(y,0);
  document.getElementById('months').textContent = Math.max(mo,0);
  document.getElementById('days').textContent = Math.max(d,0);
  document.getElementById('hours').textContent = h;
  document.getElementById('minutes').textContent = m;
  document.getElementById('seconds').textContent = s;
}
setInterval(updateTimer, 1000);

/* ====================== Story viewer ====================== */
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerCaption = document.getElementById('viewerCaption');
const viewerName = document.getElementById('viewerName');
let currentStory = 0;
let storyTimer = null;
const STORY_DURATION = 4000;
const bars = () => document.querySelectorAll('#viewerBars .fill');

function openViewer(i){
  currentStory = i;
  viewer.classList.add('open');
  audio.pause();
  updatePlayIcon();
  renderStory();
}
function closeViewer(){
  viewer.classList.remove('open');
  clearTimeout(storyTimer);
}
function renderStory(){
  clearTimeout(storyTimer);
  const s = CONFIG.stories[currentStory];
  viewerImg.src = s.imageUrl;
  viewerCaption.textContent = s.caption;
  viewerName.textContent = s.name;
  bars().forEach((f, idx) => {
    f.style.transition = 'none';
    f.style.width = idx < currentStory ? '100%' : '0%';
  });
  requestAnimationFrame(() => {
    const f = bars()[currentStory];
    f.style.transition = `width ${STORY_DURATION}ms linear`;
    requestAnimationFrame(() => f.style.width = '100%');
  });
  storyTimer = setTimeout(nextStory, STORY_DURATION);
}
function nextStory(){
  if (currentStory < CONFIG.stories.length - 1){ currentStory++; renderStory(); }
  else { closeViewer(); }
}
function prevStory(){
  if (currentStory > 0){ currentStory--; renderStory(); }
  else { renderStory(); }
}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.getElementById('navNext').addEventListener('click', nextStory);
document.getElementById('navPrev').addEventListener('click', prevStory);

/* ====================== Player ====================== */
const audio = new Audio();
audio.loop = true;
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');

let artImgs = [];
let artIndex = 0;
setInterval(() => {
  if (!artImgs.length) return;
  artImgs[artIndex].classList.remove('active');
  artIndex = (artIndex + 1) % artImgs.length;
  artImgs[artIndex].classList.add('active');
}, 4000);

function fmt(t){
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
function updatePlayIcon(){
  playIcon.innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
}
playBtn.addEventListener('click', () => {
  if (!audio.src) return;
  if (audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
  updatePlayIcon();
});
audio.addEventListener('timeupdate', () => {
  if (audio.duration){
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    curTime.textContent = fmt(audio.currentTime);
    durTime.textContent = fmt(audio.duration);
  }
});
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = ratio * audio.duration;
});
document.getElementById('nextBtn').addEventListener('click', () => { audio.currentTime = 0; });
document.getElementById('prevBtn').addEventListener('click', () => { audio.currentTime = 0; });

/* ====================== Entry / reveal ====================== */
document.getElementById('openBtn').addEventListener('click', () => {
  document.getElementById('entry').classList.add('hidden');
  document.getElementById('main').classList.add('show');
  if (audio.src) audio.play().catch(()=>{});
  updatePlayIcon();
});

loadConfig();
</script>
</body>
</html>
