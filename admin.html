<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — João &amp; Layla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1c0f22; --wine:#5c2a4d; --rose:#f4b8c7; --gold:#d9a95c; --cream:#faf1e4; --ink:#2a1420;
    --ok:#7fbf8f; --err:#e08a8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(180deg, var(--night), var(--ink));
    font-family:'Space Grotesk', sans-serif; color:var(--cream); display:flex; justify-content:center; padding:24px 16px 80px;
  }
  .wrap{width:100%; max-width:560px;}
  h1{font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 4px;}
  .sub{opacity:0.55; font-size:12px; margin:0 0 28px;}
  .card{background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:20px; margin-bottom:18px;}
  .card h2{font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin:0 0 14px; color:var(--rose);}
  label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.6; margin:12px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=datetime-local], textarea{
    width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.12); border-radius:9px;
    color:var(--cream); padding:10px 12px; font-family:'Space Grotesk', sans-serif; font-size:14px;
  }
  textarea{resize:vertical; min-height:56px;}
  input[type=file]{font-size:12px; color:var(--cream);}
  .story-block{border-top:1px dashed rgba(255,255,255,0.1); padding-top:14px; margin-top:14px;}
  .story-block:first-child{border-top:none; padding-top:0; margin-top:0;}
  .thumb-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .thumb{width:44px; height:44px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,0.08);}
  .player-pick{display:flex; align-items:center; gap:8px; font-size:12px; margin-top:8px;}
  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; cursor:pointer; border:none; border-radius:999px;
  }
  .save-btn{
    width:100%; padding:15px; font-size:15px; background:linear-gradient(120deg, var(--gold), var(--rose)); color:var(--ink);
    position:sticky; bottom:12px; box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .save-btn:disabled{opacity:0.5; cursor:default;}
  .status{text-align:center; font-size:12px; margin-top:10px; min-height:16px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}
  a.view-link{color:var(--gold); font-size:12px;}

  #gate{position:fixed; inset:0; background:var(--night); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:99;}
  #gate input{width:220px;}
  #gate button{padding:10px 24px; background:var(--gold); color:var(--ink);}
</style>
</head>
<body>

<div id="gate">
  <h1 style="font-size:20px;">Painel admin</h1>
  <input type="text" id="pin" placeholder="PIN de acesso" autocomplete="off">
  <button id="pinBtn">Entrar</button>
  <p class="status err" id="gateMsg"></p>
</div>

<div class="wrap">
  <h1>Painel admin</h1>
  <p class="sub">Edite o site — as mudanças ficam salvas no Cloudinary. <a class="view-link" href="index.html" target="_blank">Ver site ›</a></p>

  <div class="card">
    <h2>Informações gerais</h2>
    <label>Nome dele</label>
    <input type="text" id="partner1">
    <label>Nome dela</label>
    <input type="text" id="partner2">
    <label>Data e hora de início do relacionamento</label>
    <input type="datetime-local" id="sinceDate">
    <label>Frase pequena abaixo do título</label>
    <input type="text" id="sinceLabel">
    <label>Mensagem do rodapé</label>
    <textarea id="footerMessage"></textarea>
    <label>Assinatura do rodapé</label>
    <input type="text" id="footerSign">
  </div>

  <div class="card">
    <h2>Música</h2>
    <label>Título da música</label>
    <input type="text" id="songTitle">
    <label>Artista</label>
    <input type="text" id="songArtist">
    <label>Arquivo de áudio (mp3)</label>
    <input type="file" id="audioFile" accept="audio/*">
    <div class="thumb-row"><span id="audioStatus" style="font-size:12px; opacity:0.6;">nenhum áudio enviado ainda</span></div>
  </div>

  <div class="card">
    <h2>Galeria (stories)</h2>
    <div id="storiesWrap"></div>
  </div>

  <div class="card">
    <h2>Fotos do player (escolha até 3)</h2>
    <div id="playerPickWrap"></div>
  </div>

  <button class="save-btn" id="saveBtn">Salvar alterações</button>
  <p class="status" id="statusMsg"></p>
</div>

<script>
const CLOUD_NAME = "dcvqnr1c";
const UPLOAD_PRESET = "joao-e-layla";
const CLOUD_FOLDER = "joao-e-layla";
const CONFIG_URL = `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${CLOUD_FOLDER}/config.json`;
const IMAGE_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
const VIDEO_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`; // áudio entra como "video" no Cloudinary
const RAW_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`;

// TROQUE ESTE PIN antes de publicar o site. Isto NÃO é uma senha segura de
// verdade (é só client-side) — serve para afastar visitantes casuais.
// Não compartilhe o link deste admin.html com ninguém além de você.
const ADMIN_PIN = "layla2024";

const DEFAULT_CONFIG = {
  partner1: "João",
  partner2: "Layla",
  sinceDate: "2024-03-28T22:00",
  sinceLabel: "contando cada segundo desde as 22:00",
  footerMessage: "Cada segundo desde que começamos vale a pena contar.",
  footerSign: "com amor, João",
  songTitle: "Nome da música",
  songArtist: "João & Layla",
  audioUrl: "",
  stories: [
    { name: "1º encontro", caption: "Onde tudo começou", imageUrl: "" },
    { name: "Primeira viagem", caption: "Nossa primeira viagem juntos", imageUrl: "" },
    { name: "Dia especial", caption: "Um dia que não esqueço", imageUrl: "" },
    { name: "Risadas", caption: "Sempre rindo com você", imageUrl: "" },
    { name: "Aniversário", caption: "Comemorando mais um ano", imageUrl: "" },
    { name: "Hoje", caption: "E hoje, ainda apaixonado", imageUrl: "" }
  ],
  playerPhotoUrls: []
};

let CONFIG = null;

// ---------- Gate ----------
document.getElementById('pinBtn').addEventListener('click', checkPin);
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
function checkPin(){
  const val = document.getElementById('pin').value;
  if (val === ADMIN_PIN){
    document.getElementById('gate').style.display = 'none';
    init();
  } else {
    document.getElementById('gateMsg').textContent = 'PIN incorreto.';
  }
}

// ---------- Init ----------
async function init(){
  try{
    const res = await fetch(CONFIG_URL + "?t=" + Date.now(), { cache: "no-store" });
    CONFIG = res.ok ? Object.assign({}, DEFAULT_CONFIG, await res.json()) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }catch(e){
    CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }
  fillForm();
}

function fillForm(){
  document.getElementById('partner1').value = CONFIG.partner1;
  document.getElementById('partner2').value = CONFIG.partner2;
  document.getElementById('sinceDate').value = CONFIG.sinceDate;
  document.getElementById('sinceLabel').value = CONFIG.sinceLabel;
  document.getElementById('footerMessage').value = CONFIG.footerMessage;
  document.getElementById('footerSign').value = CONFIG.footerSign;
  document.getElementById('songTitle').value = CONFIG.songTitle;
  document.getElementById('songArtist').value = CONFIG.songArtist;
  if (CONFIG.audioUrl){
    document.getElementById('audioStatus').textContent = "áudio atual salvo ✓ (envie outro arquivo para substituir)";
  }

  const storiesWrap = document.getElementById('storiesWrap');
  storiesWrap.innerHTML = "";
  CONFIG.stories.forEach((s, i) => {
    const block = document.createElement('div');
    block.className = 'story-block';
    block.innerHTML = `
      <label>Legenda curta (story ${i+1})</label>
      <input type="text" data-field="name" data-i="${i}" value="${escapeHtml(s.name)}">
      <label>Legenda na tela cheia</label>
      <input type="text" data-field="caption" data-i="${i}" value="${escapeHtml(s.caption)}">
      <label>Foto</label>
      <div class="thumb-row">
        <img class="thumb" data-thumb="${i}" src="${s.imageUrl || ''}" onerror="this.style.opacity=0">
        <input type="file" accept="image/*" data-upload="${i}">
      </div>`;
    storiesWrap.appendChild(block);
  });
  storiesWrap.querySelectorAll('input[data-field]').forEach(el => {
    el.addEventListener('input', () => {
      CONFIG.stories[el.dataset.i][el.dataset.field] = el.value;
      if (el.dataset.field === 'name') renderPlayerPicks();
    });
  });
  storiesWrap.querySelectorAll('input[type=file][data-upload]').forEach(el => {
    el.addEventListener('change', async () => {
      const i = el.dataset.upload;
      const file = el.files[0];
      if (!file) return;
      setStatus('Enviando foto...', '');
      try{
        const url = await uploadToCloudinary(file, IMAGE_UPLOAD_URL);
        CONFIG.stories[i].imageUrl = url;
        storiesWrap.querySelector(`img[data-thumb="${i}"]`).src = url;
        storiesWrap.querySelector(`img[data-thumb="${i}"]`).style.opacity = 1;
        renderPlayerPicks();
        setStatus('Foto enviada ✓', 'ok');
      }catch(e){ setStatus('Falha ao enviar a foto: ' + e.message, 'err'); }
    });
  });

  document.getElementById('audioFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus('Enviando música...', '');
    try{
      const url = await uploadToCloudinary(file, VIDEO_UPLOAD_URL);
      CONFIG.audioUrl = url;
      document.getElementById('audioStatus').textContent = "áudio enviado ✓";
      setStatus('Música enviada ✓', 'ok');
    }catch(e){ setStatus('Falha ao enviar a música: ' + e.message, 'err'); }
  });

  renderPlayerPicks();
}

function renderPlayerPicks(){
  const wrap = document.getElementById('playerPickWrap');
  wrap.innerHTML = "";
  CONFIG.stories.forEach((s) => {
    if (!s.imageUrl) return;
    const id = 'pick-' + Math.random().toString(36).slice(2);
    const row = document.createElement('label');
    row.className = 'player-pick';
    row.style.textTransform = 'none'; row.style.letterSpacing = 'normal'; row.style.opacity = '1';
    const checked = CONFIG.playerPhotoUrls.includes(s.imageUrl) ? 'checked' : '';
    row.innerHTML = `<input type="checkbox" id="${id}" value="${s.imageUrl}" ${checked}> <img class="thumb" style="width:28px;height:28px;" src="${s.imageUrl}"> ${escapeHtml(s.name)}`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const checkedBoxes = [...wrap.querySelectorAll('input[type=checkbox]:checked')];
      if (checkedBoxes.length > 3){
        cb.checked = false;
        setStatus('Escolha no máximo 3 fotos para o player.', 'err');
        return;
      }
      CONFIG.playerPhotoUrls = checkedBoxes.map(b => b.value);
    });
  });
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function uploadToCloudinary(file, endpoint){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', CLOUD_FOLDER);
  const res = await fetch(endpoint, { method: 'POST', body: fd });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error ? data.error.message : 'erro no upload');
  return data.secure_url;
}

function setStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  CONFIG.partner1 = document.getElementById('partner1').value;
  CONFIG.partner2 = document.getElementById('partner2').value;
  CONFIG.sinceDate = document.getElementById('sinceDate').value;
  CONFIG.sinceLabel = document.getElementById('sinceLabel').value;
  CONFIG.footerMessage = document.getElementById('footerMessage').value;
  CONFIG.footerSign = document.getElementById('footerSign').value;
  CONFIG.songTitle = document.getElementById('songTitle').value;
  CONFIG.songArtist = document.getElementById('songArtist').value;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('Salvando...', '');
  try{
    const blob = new Blob([JSON.stringify(CONFIG, null, 2)], { type: 'application/json' });
    const fd = new FormData();
    fd.append('file', blob, 'config.json');
    fd.append('upload_preset', UPLOAD_PRESET);
    fd.append('folder', CLOUD_FOLDER);
    fd.append('public_id', 'config');
    fd.append('overwrite', 'true');
    fd.append('invalidate', 'true');
    const res = await fetch(RAW_UPLOAD_URL, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ? data.error.message : 'erro ao salvar');
    setStatus('Salvo! O site pode levar alguns minutos para atualizar (cache).', 'ok');
  }catch(e){
    setStatus('Não foi possível salvar: ' + e.message + ' — confira se o preset "joao-e-layla" está com Overwrite habilitado no Cloudinary.', 'err');
  }
  btn.disabled = false;
});
</script>
</body>
</html>
